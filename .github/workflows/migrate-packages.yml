name: Migrate Docker and Helm to GHCR

on:
  workflow_dispatch:

env:
  OLD_IMAGE: ghcr.io/nginxinc/gateway-lens
  NEW_IMAGE: ghcr.io/nginx/gateway-lens
  OLD_CHART: ghcr.io/nginxinc/charts/gateway-lens
  NEW_CHART: ghcr.io/nginx/charts/gateway-lens

jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up crane
        uses: imjasonh/setup-crane@v0.4

      # crane copy preserves multi-arch manifest lists, signatures and attestations.
      - name: Copy Docker image tags
        run: |
          for tag in $(crane ls "${OLD_IMAGE}"); do
            echo "Copying ${OLD_IMAGE}:${tag}"
            crane copy "${OLD_IMAGE}:${tag}" "${NEW_IMAGE}:${tag}"
          done

      - name: Copy Helm chart tags
        run: |
          for tag in $(crane ls "${OLD_CHART}"); do
            echo "Copying ${OLD_CHART}:${tag}"
            crane copy "${OLD_CHART}:${tag}" "${NEW_CHART}:${tag}"
          done

---
name: Update Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version to set as the chart's version and appVersion (e.g. v1.2.3)
        required: true

permissions:
  contents: read

jobs:
  update-version:
    name: Update Version
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Golang Environment
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: go.sum
      - name: Update Chart.yaml
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          if [[ ! "${VERSION_INPUT}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version input '${VERSION_INPUT}' is not a valid semantic version (expected e.g. v1.2.3 or 1.2.3)"
            exit 1
          fi
          export version="${VERSION_INPUT#v}"
          yq -i '.version = strenv(version) | .appVersion = strenv(version)' charts/gateway-lens/Chart.yaml
      - name: Regenerate Generated Files
        run: make generate
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "Update gateway-lens chart version to ${{ inputs.version }}"
          title: "Update gateway-lens chart version to ${{ inputs.version }}"
          body: Updates `charts/gateway-lens/Chart.yaml` `version` and `appVersion` to `${{ inputs.version }}`, and regenerates the derived files.
          branch: chore/update-chart-version-${{ inputs.version }}

apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway-lens
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gateway-lens
rules:
  - apiGroups: ["gateway.networking.k8s.io"]
    resources:
      - gatewayclasses
      - gateways
      - httproutes
      - grpcroutes
      - tlsroutes
      - tcproutes
      - udproutes
      - referencegrants
      - backendtlspolicies
      - listenersets
    verbs: ["watch", "list", "get"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources:
      - customresourcedefinitions
    verbs: ["watch", "list", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gateway-lens
subjects:
  - kind: ServiceAccount
    name: gateway-lens
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gateway-lens
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-lens
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-lens
  template:
    metadata:
      labels:
        app: gateway-lens
    spec:
      serviceAccountName: gateway-lens
      containers:
        - name: gateway-lens
          image: ghcr.io/sjberman/gateway-lens:latest
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      securityContext:
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-lens
  namespace: default
spec:
  selector:
    app: gateway-lens
  ports:
    - name: http
      port: 80
      targetPort: http

# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: clusterrolebinding
templates:
  - clusterrolebinding.yaml
tests:
  - it: should bind the ServiceAccount to the ClusterRole, both named after the fullname
    release:
      name: my-release
      namespace: my-namespace
    asserts:
      - isKind:
          of: ClusterRoleBinding
      - equal:
          path: metadata.name
          value: my-release-gateway-lens
      - equal:
          path: subjects[0].kind
          value: ServiceAccount
      - equal:
          path: subjects[0].name
          value: my-release-gateway-lens
      - equal:
          path: subjects[0].namespace
          value: my-namespace
      - equal:
          path: roleRef.kind
          value: ClusterRole
      - equal:
          path: roleRef.apiGroup
          value: rbac.authorization.k8s.io
      - equal:
          path: roleRef.name
          value: my-release-gateway-lens

  - it: should reference the custom serviceAccount name when configured
    set:
      serviceAccount.name: custom-sa
    asserts:
      - equal:
          path: subjects[0].name
          value: custom-sa

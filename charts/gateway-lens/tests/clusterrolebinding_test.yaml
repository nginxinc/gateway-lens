# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: clusterrolebinding
templates:
  - clusterrolebinding.yaml
tests:
  - it: should bind the ServiceAccount to the ClusterRole, both named after the namespace-qualified fullname
    release:
      name: my-release
      namespace: my-namespace
    asserts:
      - isKind:
          of: ClusterRoleBinding
      - equal:
          path: metadata.name
          value: my-namespace-my-release-gateway-lens
      - equal:
          path: subjects[0].kind
          value: ServiceAccount
      - equal:
          path: subjects[0].name
          value: my-release-gateway-lens
      - equal:
          path: subjects[0].namespace
          value: my-namespace
      - equal:
          path: roleRef.kind
          value: ClusterRole
      - equal:
          path: roleRef.apiGroup
          value: rbac.authorization.k8s.io
      - equal:
          path: roleRef.name
          value: my-namespace-my-release-gateway-lens

  - it: should produce different ClusterRoleBinding names for the same release name in different namespaces
    release:
      name: my-release
      namespace: namespace-a
    asserts:
      - notEqual:
          path: metadata.name
          value: my-release-gateway-lens
      - equal:
          path: metadata.name
          value: namespace-a-my-release-gateway-lens

  - it: should stay within the 63-char name limit and append a hash (not just truncate) when the namespace-qualified name would otherwise be too long, so two long names differing only in their tail don't collide
    release:
      name: my-release
      namespace: a-very-long-namespace-name-that-pushes-the-total-length-past-63-chars-A
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: "^.{1,63}$"
      - matchRegex:
          path: metadata.name
          pattern: "-[0-9a-f]{8}$"

  - it: should produce a different hashed name than a similarly long namespace differing only near the truncation point
    release:
      name: my-release
      namespace: a-very-long-namespace-name-that-pushes-the-total-length-past-63-chars-B
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: "-[0-9a-f]{8}$"

  - it: should reference the custom serviceAccount name when configured
    set:
      serviceAccount.name: custom-sa
    asserts:
      - equal:
          path: subjects[0].name
          value: custom-sa

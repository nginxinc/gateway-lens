# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: serviceaccount
templates:
  - serviceaccount.yaml
tests:
  - it: should create a ServiceAccount by default, named after the fullname
    release:
      name: my-release
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: my-release-gateway-lens
      - equal:
          path: automountServiceAccountToken
          value: false

  - it: should not create a ServiceAccount when serviceAccount.create is false
    set:
      serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should use the configured serviceAccount name when set
    set:
      serviceAccount.name: custom-sa
    asserts:
      - equal:
          path: metadata.name
          value: custom-sa

  - it: should render annotations when set
    set:
      serviceAccount.annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/gateway-lens
    asserts:
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: arn:aws:iam::123456789012:role/gateway-lens

  - it: should not render an annotations block by default
    asserts:
      - notExists:
          path: metadata.annotations

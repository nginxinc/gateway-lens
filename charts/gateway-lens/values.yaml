# yaml-language-server: $schema=values.schema.json

# -- Number of gateway-lens Deployment replicas to run.
replicaCount: 1

image:
  # -- The gateway-lens container image repository.
  repository: ghcr.io/nginxinc/gateway-lens
  # -- The gateway-lens container image tag.
  # @default -- The chart's appVersion.
  tag: ""
  # @schema
  # enum:
  #   - Always
  #   - IfNotPresent
  #   - Never
  # @schema
  # -- The image pull policy for the gateway-lens container.
  pullPolicy: IfNotPresent

# @schema
# type: integer
# minimum: 1
# maximum: 65535
# @schema
# -- Port for the dashboard HTTP server. Passed to the container as `--port`.
port: 8080

# @schema
# enum:
#   - debug
#   - info
#   - error
#   - panic
# @schema
# -- Log level for the controller. Passed to the container as `--log-level`.
logLevel: info

# -- List of namespaces to watch. If empty, all namespaces are watched.
# Passed to the container as a comma-separated `--namespaces` flag.
namespaces: []

# -- Extra CLI args passed to the container.
extraArgs: []

serviceAccount:
  # -- Whether to create a ServiceAccount for gateway-lens.
  create: true
  # -- The name of the ServiceAccount to use.
  # @default -- Autogenerated if not set or set to "".
  name: ""
  # -- Annotations to add to the ServiceAccount.
  annotations: {}

# -- RBAC for Gateway API extension CRDs (policies, parametersRef/extensionRef
# targets) that gateway-lens discovers at runtime and can't know about
# ahead of time. See `charts/gateway-lens/providers/` and the chart README.
rbac:
  # @schema
  # items:
  #   type: string
  #   minLength: 1
  # @schema
  # -- Names of curated provider rule sets to include, each corresponding to
  # a `providers/<name>.yaml` file shipped in this chart, e.g.
  # `["nginx-gateway-fabric"]`.
  providers: []
  # @schema
  # items:
  #   type: object
  #   required: [apiGroups, resources]
  #   properties:
  #     apiGroups:
  #       type: array
  #       items:
  #         type: string
  #         minLength: 1
  #     resources:
  #       type: array
  #       items:
  #         type: string
  #         minLength: 1
  # @schema
  # -- Additional raw RBAC rules (`apiGroups`/`resources` only — verbs are
  # always `watch`/`list`/`get`) for CRDs not covered by a provider file, e.g.
  # `[{apiGroups: ["gateway.example.io"], resources: ["someextensionpolicies"]}]`.
  extraRules: []

service:
  # @schema
  # enum:
  #   - ClusterIP
  #   - NodePort
  #   - LoadBalancer
  # @schema
  # -- The Kubernetes Service type.
  type: ClusterIP
  # @schema
  # type: integer
  # minimum: 1
  # maximum: 65535
  # @schema
  # -- The Service port.
  port: 80

# -- Resource requests and/or limits for the gateway-lens container.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi

# -- Extra annotations to add to the Pod.
podAnnotations: {}
# -- Extra labels to add to the Pod.
podLabels: {}

# -- Node selector for the Pod.
nodeSelector: {}
# -- Tolerations for the Pod.
tolerations: []
# -- Affinity rules for the Pod.
affinity: {}

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "gateway-lens.fullname" . }}
  labels:
    {{- include "gateway-lens.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "gateway-lens.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "gateway-lens.fullname" . }}
